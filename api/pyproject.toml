[project]
name = "ninebox-api"
version = "2.0.0"
requires-python = ">=3.12"
dependencies = [
  "django>=5.2,<6",
  "djangorestframework>=3.16",
  "djangorestframework-simplejwt>=5.5",
  "django-cors-headers>=4.7",
  "django-filter>=25.1",
  "drf-spectacular>=0.28",
  "dj-database-url>=2.3",
  "psycopg[binary]>=3.2",
  "whitenoise>=6.9",
  "channels>=4.2",
  "uvicorn[standard]>=0.34",
]

[dependency-groups]
dev = [
    "daphne>=4.1",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-django>=4.11",
    "ruff>=0.11",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "core.settings"
python_files = ["test_*.py"]
addopts = "-q"
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 160
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B904"]
